        font-family: Arial;
      }
      .container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
      }

  </head>
  <body>
    <div class="container">
      <p style="background-color: lightblue;">
        blue box...

      <p style="background-color: lightpink;">
        pink box...
      </p>
      <p style="background-color: lightblue;">
        blue box...
      </p>
    </div>
    
  </body>
</html>
