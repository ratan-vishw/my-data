<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .ex1 {
      border:5px solid red;
    }
    .ex2 {
      border: 5px double blue;
    }
    .ex3 {
      border: 5px dotted rgb(255, 208, 0);
    }
    .ex4 {
      border: 5px dashed cyan;
    }
    .ex5 {
      border: 5px groove green;
    }
    .ex6 {
      border:  5px outset pink;
    }
    .ex7 {
      border: 5px inset ;
    }
    .ex8 {
      border: 5px ridge;
    }
  </style>
</head>
<body>
  <h2 class="ex1">Solid Border</h2>
  <h2 class="ex2">Double Border</h2>
  <h2 class="ex3">Dotted border</h2>
  <h2 class="ex4">Dashed Border</h2>
  <h2 class="ex5">groove Border</h2>
  <h2 class="ex6">Insert Border</h2>
  <h2 class="ex7">Inset Border</h2>
  <h2 class="ex8">Ridge Border</h2>
</body>
</html>
