<html lang="en">
<head>

  <title>Document</title>

    table {

    }

    </tr>
    <tr>

      <td>6:50 AM</td>

    </tr>
    <tr>
      <td>19877</td>
      <td>Chennai Express</td>
      <td>6:50 AM</td>
      <td>8:30 AM</td>
    </tr>
  </table>
  <hr>
  <table border="1">
    <tr>
      <th >NAME</th>
      <th>ID</th>

      <td>RATAN</td>

</html>
