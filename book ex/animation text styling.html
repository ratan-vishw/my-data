<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 90vh;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Lato;
        }
        p {
            font-size: 3.56rem;
            color: #333;
            -webkit-text-stroke: 0.1vw black;
            text-transform: uppercase;
            position: relative;
        }
        p::before {
            content: attr(data-text);
            position: absolute;
            width: 0;
            height: 100%;
            color: red;
            left: 0;
            top: 0;
            -webkit-text-stroke: 0vw;
            overflow: hidden;
            animation: ani 4s linear infinite;
            border-right: 3px solid #008979;
        }
        @keyframes ani {
            0%, 10%, 100% {
                width: 0;
                text-shadow: 0 0 20px rgb(255, 255, 255, 0.5);
            }
            50%, 70% {
                width: 100%;
                text-shadow: 0 0 20px rgb(255, 255, 255, 0.5);
            }
        }
    </style>
</head>
<body>
    <p data-text="RATAN_VISHW">
        RATAN_VISHW
    </p>
</body>
</html>
