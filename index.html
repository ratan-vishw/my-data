<!DOCTYPE html>
<html>
  <head>
    <title>
      practice for youtube inter face...
    </title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 10px;
        background-color: #f0f2f5;
      }


      .p1 {
        margin-top: 0px;
        margin-bottom: 0px;
        font-size: 25px;
        font-weight: bold;
      }
      .p2 {
        margin-top: 3px;
        margin-bottom: 0px;
        color: rgb(96, 96, 96);
      }
      .b1 {
        background-color: #1877f2;
        color: white;
        border: none;
        border-radius: 5px;
        height: 30px;
        width: 100px;
        margin-top: 7px;
      }
      .b1:hover {
        background-color: #165bb7;
        cursor: pointer;
      }

      .profile_pic {
        margin-bottom: 4px;
        width: 150px; 
        height: 100px; 
        object-fit: cover;
        object-position: 25% 25%;
      }
      .div {
        background-color: white;
        border-radius: 8px;
        box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.1);
        padding-bottom: 10px;
      
      }
      .div:hover {
        opacity: 0.9;
        cursor: pointer;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        row-gap: 10px;
        column-gap: 5px;
      }

    </style>
  </head>

  <body>

    <div class="container">
      
        <div class="div">

            <img class="profile_pic" src="pic.jpg" tab="error">

        </div>

      </div>
