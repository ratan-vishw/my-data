<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Position Example</title>
  <style>
    .container {
      width: 500px;
      height: 300px;
      background-image: url('https://via.placeholder.com/1500');
      background-position: right bottom; /* Position background to the bottom-right */
      background-size: 200px 200px; /* Resize image to 200px by 200px */
    }
  </style>
</head>
<body>

  <div class="container"></div>

</body>
</html>
