<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>visibility: hidden; Example</title>
  <style>
    .hidden-div {
      width: 200px;
      height: 200px;
      background-color: red;
      visibility: hidden; /* Makes the div invisible, but space is still taken up */
    }

    .visible-div {
      width: 200px;
      height: 200px;
      background-color: blue;
    }
  </style>
</head>
<body>
  <div class="hidden-div"></div>
  <div class="visible-div"></div>
</body>
</html>
