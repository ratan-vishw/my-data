<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .offset-example {
      width: 200px;
      height: 100px;
      border: 2px solid #000;
      outline: 4px solid red;
      outline-offset: 20px; /* The outline will be 10px away from the element */
    }
  </style>
  <title>Outline Offset Example</title>
</head>
<body>

  <div class="offset-example">This is a box with outline offset.</div>

</body>
</html>
