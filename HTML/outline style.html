<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .outlined-element {
      outline: 4px solid orange;
    }
    .focus-outline {
      outline: 2px dashed blue;
    }
  </style>
</head>
<body>
  <div class="outlined-element">This element has a solid orange outline.</div>
  <input class="focus-outline" type="text" placeholder="Focus on me to see the dashed outline">
</body>
</html>
