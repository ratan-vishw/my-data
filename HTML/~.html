<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    h1 ~ p {
      color: red; /* This will apply to all <p> elements that come after <h1> */
    }
  </style>
  <title>General Sibling Example</title>
</head>
<body>

  <h1>Title</h1>
  <p>This paragraph will be red because it comes after the h1.</p>
  <div>Some content here.</div>
  <p>This paragraph will also be red because it comes after the h1.</p>

</body>
</html>
