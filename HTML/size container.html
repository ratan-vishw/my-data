<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Size Example</title>
  <style>
    /* Container styles */
    .container {
      width: 100%;        /* Full width of the page */
      height: 400px;      /* Fixed height */
      background-image: url('https://via.placeholder.com/1500'); /* Background image URL */
      background-size: cover;  /* Image will cover the entire container */
      background-position: center; /* Center the background image */
      background-repeat: no-repeat; /* Prevent the image from repeating */
    }

    /* Content inside the container */
    .content {
      position: absolute;
      top: 50%; /* Position in the center vertically */
      left: 50%; /* Position in the center horizontally */
      transform: translate(-50%, -50%); /* Center text precisely */
      color: white;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="content">
      Welcome to My Website!
    </div>
  </div>

</body>
</html>
