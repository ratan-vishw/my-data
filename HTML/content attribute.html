<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .message::before {
      content: "Important: ";
      font-weight: bold;
      color: red;
    }
    .message::after {
      content: " - Please read carefully!";
      font-style: italic;
      color: blue;
    }
  </style>
  <title>Content Example</title>
</head>
<body>

  <p class="message">This is a critical announcement.</p>

</body>
</html>
