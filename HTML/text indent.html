<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Indent Example</title>
  <style>
    p {
      text-indent: 30px;  /* Indent the first line of text by 30 pixels */
    }
  </style>
</head>
<body>

  <p>This is a paragraph with a 30px indentation on the first line.</p>
  <p>This is another paragraph with the same indentation.</p>

</body>
</html>
