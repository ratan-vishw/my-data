<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .linear-gradient {
      height: 100px;
      background: linear-gradient( to left, red, blue);
    }

    .radial-gradient {
      height: 100px;
      background: radial-gradient(circle, blue, green, yellow);
    }

    .conic-gradient {
      height: 100px;
      background: conic-gradient(from 45deg, red, yellow, green);
    }
  </style>
  <title>CSS Gradients</title>
</head>
<body>

  <div class="linear-gradient">Linear Gradient</div>
  <div class="radial-gradient">Radial Gradient</div>
  <div class="conic-gradient">Conic Gradient</div>

</body>
</html>
