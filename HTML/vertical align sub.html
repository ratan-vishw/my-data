<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Align Sub Example</title>
  <style>
    p {
      font-size: 20px;
    }

    .subscript {
      vertical-align: sub; /* Makes the element align as a subscript */
      font-size: 12px; /* Smaller text for subscript */
    }
  </style>
</head>
<body>

  <p>This is normal text with a <span class="subscript">2</span> as subscript, forming H<sub class="subscript">2</sub>O (water).</p>

</body>
</html>
