<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    div:empty {
      background-color: lightgray;
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <div></div> <!-- This div is empty, so the style will be applied -->
  <div>Content</div> <!-- This div has content, so the style will not be applied -->
</body>
</html>
