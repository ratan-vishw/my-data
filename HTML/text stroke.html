<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Stroke Example</title>
  <style>
    h1 {
      font-size: 100px;
      color: white; /* Text color */
      -webkit-text-stroke: 2px black; /* Stroke: 2px black outline */
    }
  </style>
</head>
<body>
  <h1>This is stroked text</h1>
</body>
</html>
