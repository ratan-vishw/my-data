<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .container {
      width: 200px;
      word-break: break-all;
      border: 1px solid #ccc;
    }
  </style>
  <title>Word Break Example</title>
</head>
<body>
  <div class="container">
    This is a very long word without spaces: supercalifragilisticexpialidocious
  </div>
</body>
</html>
