<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    h1 {
      text-align: center;
      font-family: arial;
    }
    div {
      background-color: lightpink;
      height: 200px;
      width: 200px;
      animation: example 4s infinite;
      position: relative;
      
    }
    @keyframes example {
      from {left: 0px;}
      to {left: 100vh;}
    }
  </style>
</head>
<body>
  <h1>Animation for moving a box..</h1>
  <div></div>
</body>
</html>
